[project]
name = "trace-dock-server"
version = "0.1.0"
description = "Trace Dock MVP registration and OSS verification API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "alibabacloud-oss-v2>=1.4.1,<2",
  "alibabacloud-sts20150401>=1.2.0,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
trace-dock-server = "trace_dock_server.http:main"
trace-dock-participants = "trace_dock_server.participants:main"
trace-dock-verify-oss = "trace_dock_server.verify_oss:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trace_dock_server*"]

[tool.setuptools.package-data]
trace_dock_server = ["rules.json"]
